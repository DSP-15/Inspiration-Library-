<title>Inspiration Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* ============================================================
     INSPIRATION LIBRARY — "Rule"
     Museum-plaque structure: no card containers, images breathing
     in space, plate numbers, wall-label captions. Old-style serif
     titles against a humanist sans. Hover is purely typographic:
     an underline draws beneath the title and the frame hairline
     turns accent. Nothing moves, nothing changes colour grade.
     ============================================================ */
  :root {
    --bg: #e9e8e3;
    --bg-elevated: #f3f2ee;
    --bg-sunken: #dedcd6;
    --text: #1a1d20;
    --text-muted: #6d7176;
    --accent: #2c3b4a;
    --accent-on: #f1f2f3;
    --border: #cdcdc7;
    --border-strong: #b4b4ad;
    --danger: #7d3030;

    --font-title: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "Hoefler Text", Georgia, serif;
    --font-body: Optima, "Gill Sans", "Gill Sans MT", Avenir, "Avenir Next", "Segoe UI", system-ui, sans-serif;

    --radius: 8px;
    --page-pad: clamp(20px, 4.5vw, 60px);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  img { max-width: 100%; display: block; }
  button { font: inherit; cursor: pointer; }
  a { color: inherit; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font-body); -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ---------- header ---------- */
  .site-header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 20px; flex-wrap: wrap; padding: 46px var(--page-pad) 26px;
  }
  .brand-block { display: flex; align-items: baseline; gap: 14px; }
  .brand { font-family: var(--font-title); font-size: 27px; margin: 0; font-weight: 400; }
  .brand-count { font-size: 12.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .header-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .search {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 9px 14px; font-size: 13px;
    font-family: var(--font-body); color: var(--text); width: 210px;
  }
  .search::placeholder { color: var(--text-muted); }
  .sort-select {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 9px 12px; font-size: 13px;
    font-family: var(--font-body); color: var(--text);
  }
  .btn {
    border: 1px solid var(--text); background: transparent; color: var(--text);
    padding: 10px 18px; border-radius: var(--radius);
    font-family: var(--font-body); font-size: 12.5px;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  }
  .btn:hover { background: var(--text); color: var(--bg); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-on); }
  .btn.primary:hover { background: var(--text); border-color: var(--text); color: var(--bg); }
  .btn.ghost { border-color: var(--border-strong); color: var(--text-muted); }
  .btn.ghost:hover { background: transparent; border-color: var(--text); color: var(--text); }
  .btn.danger { border-color: var(--danger); color: var(--danger); }
  .btn.danger:hover { background: var(--danger); border-color: var(--danger); color: var(--bg-elevated); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* ---------- filters ---------- */
  .filter-bar {
    padding: 0 var(--page-pad) 28px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 42px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .filter-row { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
  .filter-row.axis-row { padding-left: 2px; }
  .axis-label {
    font-size: 10.5px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--text-muted); white-space: nowrap;
    width: 82px; flex-shrink: 0;
  }
  @media (max-width: 680px) { .axis-label { width: 100%; } }
  .chip {
    border: 1px solid var(--border); background: transparent;
    color: #3c4045; border-radius: var(--radius);
    padding: 8px 14px; font-family: var(--font-body); font-size: 12.5px;
    white-space: nowrap; display: inline-flex; align-items: center; gap: 7px;
    transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease;
  }
  .chip:hover { border-color: var(--text); color: var(--text); }
  .chip .chip-count { font-size: 10.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .chip.is-active { background: var(--accent); border-color: var(--accent); color: var(--accent-on); font-weight: 500; }
  .chip.is-active .chip-count { color: var(--accent-on); opacity: 0.72; }
  .chip[data-facet="type"] { font-weight: 600; }
  .chip.chip-more { border-style: dashed; color: var(--text-muted); }
  .filter-clear {
    background: none; border: none; color: var(--accent);
    font-size: 12.5px; padding: 8px 4px; text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* ---------- grid ---------- */
  .grid {
    display: grid; gap: 54px 32px;
    grid-template-columns: repeat(3, 1fr);
    padding: 0 var(--page-pad) 60px;
  }
  @media (max-width: 1080px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 680px)  { .grid { grid-template-columns: 1fr; } }

  .card { background: transparent; border: none; padding: 0; text-align: left; display: block; width: 100%; position: relative; }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 8px; }
  .card-frame {
    position: relative; overflow: hidden;
    border: 1px solid var(--border); background: var(--bg-elevated);
    transition: border-color 0.22s ease;
  }
  .card-frame img { width: 100%; aspect-ratio: 3/2; object-fit: cover; }
  .card:hover .card-frame, .card:focus-visible .card-frame { border-color: var(--accent); }

  .card-body { padding: 17px 0 0; display: flex; flex-direction: column; gap: 9px; }
  .card-index { font-size: 11px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .card-title {
    margin: 0; font-family: var(--font-title); font-size: 24px; line-height: 1.24;
    font-weight: 400; text-wrap: balance; position: relative; display: inline-block;
  }
  .card-title::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 1px;
    background: var(--accent); transform: scaleX(0); transform-origin: left;
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .card:hover .card-title::after, .card:focus-visible .card-title::after { transform: scaleX(1); }
  .card-type { font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 5px 13px; margin-top: 3px; }
  .card-tags .tag { font-size: 12px; color: var(--text-muted); }

  /* ---------- empty ---------- */
  .empty-state { padding: 80px 20px 120px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .empty-state h2 { font-family: var(--font-title); font-size: 24px; font-weight: 400; margin: 0; }
  .empty-state p { color: var(--text-muted); font-size: 13.5px; margin: 0; max-width: 46ch; line-height: 1.6; }

  /* ---------- footer ---------- */
  .site-footer {
    border-top: 1px solid var(--border); margin-top: 20px;
    padding: 24px var(--page-pad) 46px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .footer-note { font-size: 12px; color: var(--text-muted); max-width: 54ch; line-height: 1.6; }
  .footer-tools { display: flex; gap: 9px; flex-wrap: wrap; }

  /* ---------- modals ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(26, 29, 32, 0.62);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: var(--bg-elevated); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    max-width: 1020px; width: 100%; max-height: 90vh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .detail-modal { display: grid; grid-template-columns: 1.2fr 1fr; position: relative; overflow: hidden; }
  @media (max-width: 820px) { .detail-modal { grid-template-columns: 1fr; overflow-y: auto; } }
  .detail-media { background: var(--bg-sunken); display: flex; align-items: center; justify-content: center; padding: 24px; border-right: 1px solid var(--border); }
  .detail-media img { width: 100%; height: auto; max-height: 76vh; object-fit: contain; }
  .detail-body { padding: 34px 34px 30px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
  .detail-nav { position: absolute; top: 20px; left: 20px; display: flex; gap: 6px; }
  .icon-btn {
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 50%;
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: var(--text-muted); line-height: 1; padding: 0;
  }
  .icon-btn:hover:not(:disabled) { color: var(--text); border-color: var(--text); }
  .detail-close { position: absolute; top: 20px; right: 20px; }
  .detail-type { font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .detail-title { margin: 0; font-family: var(--font-title); font-size: 33px; line-height: 1.16; font-weight: 400; }
  .detail-label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .detail-tags { display: flex; flex-wrap: wrap; gap: 7px; }
  .detail-tags .tag { font-size: 12px; color: var(--text-muted); border: 1px solid var(--border); border-radius: var(--radius); padding: 5px 11px; white-space: nowrap; }
  .detail-link { font-size: 12.5px; color: var(--accent); }
  .detail-nolink { font-size: 12.5px; color: var(--text-muted); }
  .brief-box {
    width: 100%; resize: vertical; min-height: 104px;
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px;
    font-size: 13.5px; line-height: 1.62; font-family: var(--font-body);
  }
  .btn-row { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 2px; }
  .btn-row.spread { justify-content: space-between; }

  /* ---------- add / edit form ---------- */
  .form-modal { max-width: 620px; }
  .form-scroll { overflow-y: auto; padding: 32px 34px 0; display: flex; flex-direction: column; gap: 17px; }
  .form-foot { padding: 18px 34px 26px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .form-modal h2 { margin: 0; font-family: var(--font-title); font-size: 26px; font-weight: 400; }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field label, .field .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.13em; color: var(--text-muted); }
  .field-hint { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  .field input[type="text"], .field input[type="url"], .field select, .field textarea {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 11px 13px; font-size: 13.5px;
    font-family: var(--font-body); width: 100%;
  }
  .dropzone {
    border: 1px dashed var(--border-strong); border-radius: var(--radius);
    padding: 22px 18px; text-align: center; color: var(--text-muted);
    font-size: 13px; background: var(--bg); cursor: pointer;
    transition: border-color 0.18s ease, background 0.18s ease;
  }
  .dropzone.compact { padding: 11px 18px; font-size: 12.5px; }
  .dropzone:hover, .dropzone.is-over { border-color: var(--accent); background: var(--bg-elevated); color: var(--text); }
  .dropzone input { display: none; }
  .drop-preview {
    width: 100%; height: 168px; overflow: hidden;
    border: 1px solid var(--border); border-radius: var(--radius); display: none;
  }
  .drop-preview.has-img { display: block; }
  .drop-preview img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }

  .picker { display: flex; flex-wrap: wrap; gap: 7px; }
  .pick {
    border: 1px solid var(--border); background: transparent; color: #3c4045;
    border-radius: var(--radius); padding: 7px 12px; font-size: 12.5px;
    font-family: var(--font-body); transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .pick:hover { border-color: var(--text); }
  .pick.is-on { background: var(--accent); border-color: var(--accent); color: var(--accent-on); }
  .pick.is-auto:not(.is-on) { border-color: var(--accent); color: var(--accent); }
  .auto-note { font-size: 11.5px; color: var(--accent); display: flex; align-items: center; gap: 6px; }

  .toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 12px 22px;
    border-radius: var(--radius); font-size: 12.5px; z-index: 1200; max-width: 88vw; text-align: center;
  }
  .toast[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .card-title::after, .card-frame, .chip, .btn, .pick, .dropzone { transition: none !important; }
  }
</style>

<header class="site-header">
  <div class="brand-block">
    <h1 class="brand">Inspiration Library</h1>
    <span class="brand-count" id="brand-count"></span>
  </div>
  <div class="header-tools">
    <input type="search" class="search" id="search" placeholder="Search titles and tags" aria-label="Search the library" />
    <select class="sort-select" id="sort" aria-label="Sort order">
      <option value="added">Newest first</option>
      <option value="title">By title</option>
      <option value="type">By design type</option>
    </select>
    <button class="btn primary" id="open-add">Add screenshot</button>
  </div>
</header>

<nav class="filter-bar" id="filter-bar" aria-label="Filter the library"></nav>

<main class="grid" id="grid"></main>
<div class="empty-state" id="empty-state" hidden></div>

<footer class="site-footer">
  <p class="footer-note" id="footer-note"></p>
  <div class="footer-tools">
    <button class="btn ghost" id="export-btn">Export library</button>
    <button class="btn ghost" id="import-btn">Import library</button>
    <input type="file" id="import-file" accept="application/json" hidden />
    <button class="btn ghost" id="reset-btn">Restore from repo</button>
  </div>
</footer>

<div class="modal-backdrop" id="detail-backdrop" hidden>
  <div class="modal detail-modal" id="detail-modal" role="dialog" aria-modal="true" aria-label="Reference detail"></div>
</div>

<div class="modal-backdrop" id="form-backdrop" hidden>
  <div class="modal form-modal" role="dialog" aria-modal="true" aria-label="Add or edit a reference">
    <form id="entry-form" style="display:contents">
      <div class="form-scroll">
        <h2 id="form-heading">Add to the library</h2>

        <div class="field">
          <span class="label">Screenshot</span>
          <label class="dropzone" id="dropzone">
            <input type="file" id="f-image" accept="image/*" />
            <span id="dropzone-text">Drop an image here, or click to choose</span>
          </label>
          <div class="drop-preview" id="drop-preview"><img id="drop-preview-img" alt="" /></div>
        </div>

        <div class="field">
          <label for="f-title">Title</label>
          <input type="text" id="f-title" required placeholder="Crafting Culture, Detroit" />
        </div>

        <div class="field">
          <label for="f-url">Source URL, optional</label>
          <input type="url" id="f-url" placeholder="https://" />
        </div>

        <div class="field">
          <label for="f-type">Design type</label>
          <select id="f-type" required></select>
        </div>

        <div class="field">
          <span class="label">Design vocabulary</span>
          <p class="field-hint">Pick from the shared vocabulary rather than inventing terms. Reusing the same words is what lets the filters find patterns across the library.</p>
          <div id="vocab-pickers"></div>
        </div>

        <div class="field">
          <label for="f-brief">Brief, used by Copy prompt</label>
          <p class="field-hint">Written for you from the selections above. Edit it if you want.</p>
          <textarea id="f-brief" class="brief-box"></textarea>
        </div>
      </div>
      <div class="form-foot">
        <button type="button" class="btn danger" id="delete-entry" hidden>Delete</button>
        <span style="flex:1"></span>
        <button type="button" class="btn" id="cancel-form">Cancel</button>
        <button type="submit" class="btn primary" id="submit-form">Add card</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";

  /* ============================================================
     CONTROLLED VOCABULARY
     A fixed shared vocabulary is what keeps the filter bar useful.
     Free-text tags fragment into one-off terms that never group.
     ============================================================ */
  var TYPES = [
    "Portfolio", "Studio / Agency", "E-commerce", "Product / SaaS",
    "Editorial", "Landing Page", "App Interface", "Brand / Campaign"
  ];

  var AXES = [
    { key: "layout", label: "Layout", terms: [
      "asymmetric grid", "editorial columns", "full-bleed imagery", "bento grid",
      "masonry", "centred composition", "split screen", "dense index",
      "product grid", "generous whitespace"
    ]},
    { key: "typography", label: "Typography", terms: [
      "oversized display", "serif display", "grotesk display", "monospace accents",
      "tight tracking", "type as image", "small caps labels"
    ]},
    { key: "colour", label: "Colour", terms: [
      "monochrome", "single saturated accent", "warm neutral ground", "cool neutral ground",
      "dark ground", "high contrast", "duotone", "muted palette"
    ]},
    { key: "imagery", label: "Imagery", terms: [
      "editorial photography", "product photography", "3D render",
      "illustration", "archival grain", "motion or video", "no imagery"
    ]}
  ];
  var AXIS_BY_TERM = {};
  AXES.forEach(function (a) { a.terms.forEach(function (t) { AXIS_BY_TERM[t] = a.key; }); });

  var SEED = __LIBRARY_DATA__;
  var BUILD_ID = "__BUILD_ID__";

  var STORAGE_KEY = "inspiration-library-rule-v1";
  var state = {
    cards: [], activeFilters: [], query: "", sort: "added",
    showAllTags: false, editingId: null
  };

  /* ---------- persistence ---------- */
  // The repository is the source of truth. A build carries its own id, so when
  // a newer one is published it replaces whatever this browser had cached
  // rather than leaving the viewer on a stale copy.
  var freshBuild = false;
  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var p = JSON.parse(raw);
        if (p && Array.isArray(p.cards) && p.cards.length) {
          if (p.buildId === BUILD_ID) {
            state.cards = p.cards;
            state.sort = p.sort || "added";
            return;
          }
          freshBuild = true;
        }
      }
    } catch (e) {}
    state.cards = SEED.map(function (c) { return JSON.parse(JSON.stringify(c)); });
  }
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ cards: state.cards, sort: state.sort, buildId: BUILD_ID }));
    } catch (e) {
      showToast("Could not save. The library may be too large for this browser's storage.");
    }
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "class") node.className = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] === true) node.setAttribute(k, "");
      else if (attrs[k] !== false && attrs[k] != null) node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  /* ============================================================
     FILTER MODEL
     Type is always shown. Vocabulary terms are shown only once
     they group: below the threshold the bar would just mirror the
     cards one-to-one, which is noise, not navigation.
     ============================================================ */
  var GROUPING_THRESHOLD = 6;

  function termCounts() {
    var counts = {};
    state.cards.forEach(function (c) {
      (c.vocab || []).forEach(function (v) { counts[v] = (counts[v] || 0) + 1; });
    });
    return counts;
  }
  function typeCounts() {
    var counts = {};
    state.cards.forEach(function (c) { counts[c.type] = (counts[c.type] || 0) + 1; });
    return counts;
  }

  function visibleCards() {
    var q = state.query.trim().toLowerCase();
    var out = state.cards.filter(function (c) {
      if (state.activeFilters.length) {
        var hit = state.activeFilters.every(function (f) {
          if (f.indexOf("type:") === 0) return c.type === f.slice(5);
          return (c.vocab || []).indexOf(f.slice(6)) !== -1;
        });
        if (!hit) return false;
      }
      if (q) {
        var hay = (c.title + " " + c.type + " " + (c.vocab || []).join(" ")).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    if (state.sort === "title") out.sort(function (a, b) { return a.title.localeCompare(b.title); });
    else if (state.sort === "type") out.sort(function (a, b) { return a.type.localeCompare(b.type) || a.title.localeCompare(b.title); });
    else out.sort(function (a, b) { return (b.added || 0) - (a.added || 0); });
    return out;
  }

  function toggleFilter(key) {
    var i = state.activeFilters.indexOf(key);
    if (i === -1) state.activeFilters.push(key); else state.activeFilters.splice(i, 1);
    render();
  }

  function renderFilters() {
    var bar = document.getElementById("filter-bar");
    bar.innerHTML = "";

    var tc = typeCounts();
    var typeRow = el("div", { class: "filter-row" });
    typeRow.appendChild(el("button", {
      class: "chip" + (state.activeFilters.length === 0 ? " is-active" : ""),
      "data-facet": "type",
      onclick: function () { state.activeFilters = []; render(); }
    }, [document.createTextNode("All"), el("span", { class: "chip-count", text: String(state.cards.length) })]));

    TYPES.filter(function (t) { return tc[t]; }).forEach(function (t) {
      var key = "type:" + t;
      typeRow.appendChild(el("button", {
        class: "chip" + (state.activeFilters.indexOf(key) !== -1 ? " is-active" : ""),
        "data-facet": "type", onclick: function () { toggleFilter(key); }
      }, [document.createTextNode(t), el("span", { class: "chip-count", text: String(tc[t]) })]));
    });
    bar.appendChild(typeRow);

    var counts = termCounts();
    var grouping = state.cards.length > GROUPING_THRESHOLD && !state.showAllTags;
    var hiddenCount = 0;

    AXES.forEach(function (axis) {
      var terms = axis.terms.filter(function (t) {
        if (!counts[t]) return false;
        if (grouping && counts[t] < 2) { hiddenCount++; return false; }
        return true;
      });
      if (!terms.length) return;
      var row = el("div", { class: "filter-row axis-row" });
      row.appendChild(el("span", { class: "axis-label", text: axis.label }));
      terms.forEach(function (t) {
        var key = "vocab:" + t;
        row.appendChild(el("button", {
          class: "chip" + (state.activeFilters.indexOf(key) !== -1 ? " is-active" : ""),
          onclick: function () { toggleFilter(key); }
        }, [document.createTextNode(t), el("span", { class: "chip-count", text: String(counts[t]) })]));
      });
      bar.appendChild(row);
    });

    if (hiddenCount || (state.showAllTags && state.cards.length > GROUPING_THRESHOLD)) {
      var moreRow = el("div", { class: "filter-row axis-row" });
      moreRow.appendChild(el("span", { class: "axis-label", text: "" }));
      moreRow.appendChild(hiddenCount
        ? el("button", { class: "chip chip-more", text: "Show " + hiddenCount + " one-off " + (hiddenCount === 1 ? "tag" : "tags"),
            onclick: function () { state.showAllTags = true; render(); } })
        : el("button", { class: "chip chip-more", text: "Show shared tags only",
            onclick: function () { state.showAllTags = false; render(); } }));
      bar.appendChild(moreRow);
    }

    if (state.activeFilters.length) {
      var clearRow = el("div", { class: "filter-row" });
      clearRow.appendChild(el("button", {
        class: "filter-clear", text: "Clear " + state.activeFilters.length + " filter" + (state.activeFilters.length === 1 ? "" : "s"),
        onclick: function () { state.activeFilters = []; render(); }
      }));
      bar.appendChild(clearRow);
    }
  }

  function renderGrid() {
    var grid = document.getElementById("grid");
    var empty = document.getElementById("empty-state");
    grid.innerHTML = ""; empty.innerHTML = "";
    var list = visibleCards();

    document.getElementById("brand-count").textContent =
      state.cards.length + (state.cards.length === 1 ? " reference" : " references");

    if (!list.length) {
      empty.hidden = false;
      if (!state.cards.length) {
        empty.appendChild(el("h2", { text: "The library is empty" }));
        empty.appendChild(el("p", { text: "Add a screenshot to begin. Pick its design type and vocabulary from the shared list, and the brief writes itself." }));
        empty.appendChild(el("button", { class: "btn primary", text: "Add screenshot", onclick: openAdd }));
      } else {
        empty.appendChild(el("h2", { text: "Nothing matches" }));
        empty.appendChild(el("p", { text: "No reference carries every filter you have selected. Remove one, or clear them all." }));
        empty.appendChild(el("button", { class: "btn", text: "Clear filters", onclick: function () { state.activeFilters = []; state.query = ""; document.getElementById("search").value = ""; render(); } }));
      }
      return;
    }
    empty.hidden = true;

    list.forEach(function (card, i) {
      var tagWrap = el("div", { class: "card-tags" });
      (card.vocab || []).slice(0, 4).forEach(function (v) { tagWrap.appendChild(el("span", { class: "tag", text: v })); });

      grid.appendChild(el("article", {
        class: "card", tabindex: "0", role: "button",
        "aria-label": card.title + ", " + card.type,
        onclick: function () { openDetail(card.id); },
        onkeydown: function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDetail(card.id); } }
      }, [
        el("div", { class: "card-frame" }, [el("img", { src: card.image, alt: card.title, loading: "lazy" })]),
        el("div", { class: "card-body" }, [
          el("div", { class: "card-index", text: "Plate " + String(i + 1).padStart(2, "0") }),
          el("h2", { class: "card-title", text: card.title }),
          el("div", { class: "card-type", text: card.type }),
          tagWrap
        ])
      ]));
    });
  }

  function renderFooter() {
    var counts = termCounts();
    var shared = Object.keys(counts).filter(function (k) { return counts[k] > 1; }).length;
    document.getElementById("footer-note").textContent = state.cards.length > GROUPING_THRESHOLD
      ? shared + " tags now appear on more than one reference and drive the filters. One-off tags stay on their card."
      : "Filters show every tag until the library passes " + GROUPING_THRESHOLD + " references. After that, only tags shared by two or more references stay in the bar.";
  }

  function render() { renderFilters(); renderGrid(); renderFooter(); saveState(); }

  /* ---------- detail ---------- */
  var lastFocused = null;

  function openDetail(id) {
    var list = visibleCards();
    var idx = list.findIndex(function (c) { return c.id === id; });
    if (idx === -1) return;
    lastFocused = document.activeElement;
    paintDetail(list, idx);
    document.getElementById("detail-backdrop").hidden = false;
  }

  function paintDetail(list, idx) {
    var card = list[idx];
    var modal = document.getElementById("detail-modal");
    modal.innerHTML = "";

    var tagWrap = el("div", { class: "detail-tags" });
    (card.vocab || []).forEach(function (v) { tagWrap.appendChild(el("span", { class: "tag", text: v })); });

    var briefBox = el("textarea", { class: "brief-box", "aria-label": "Brief" });
    briefBox.value = card.brief || "";
    briefBox.addEventListener("input", function () {
      var live = state.cards.find(function (c) { return c.id === card.id; });
      if (live) { live.brief = briefBox.value; saveState(); }
    });

    modal.appendChild(el("div", { class: "detail-media" }, [el("img", { src: card.image, alt: card.title })]));
    modal.appendChild(el("div", { class: "detail-body" }, [
      el("div", { class: "detail-type", text: card.type }),
      el("h2", { class: "detail-title", text: card.title }),
      card.sourceUrl
        ? el("a", { class: "detail-link", href: card.sourceUrl, target: "_blank", rel: "noopener noreferrer", text: "Visit site ↗" })
        : el("div", { class: "detail-nolink", text: "No source URL" }),
      el("div", { class: "detail-label", text: "Design vocabulary" }),
      tagWrap,
      el("div", { class: "detail-label", text: "Brief" }),
      briefBox,
      el("div", { class: "btn-row" }, [
        el("button", { class: "btn", type: "button", text: "Copy prompt", onclick: function () { copyText(briefBox.value); } }),
        el("button", { class: "btn primary", type: "button", text: "Copy image", onclick: function () { copyImage(card.image); } }),
        el("button", { class: "btn ghost", type: "button", text: "Edit", onclick: function () { closeDetail(); openEdit(card.id); } })
      ])
    ]));

    var nav = el("div", { class: "detail-nav" }, [
      el("button", { class: "icon-btn", type: "button", "aria-label": "Previous", text: "‹", disabled: idx === 0,
        onclick: function () { if (idx > 0) paintDetail(list, idx - 1); } }),
      el("button", { class: "icon-btn", type: "button", "aria-label": "Next", text: "›", disabled: idx === list.length - 1,
        onclick: function () { if (idx < list.length - 1) paintDetail(list, idx + 1); } })
    ]);
    modal.appendChild(nav);
    modal.appendChild(el("button", { class: "icon-btn detail-close", type: "button", "aria-label": "Close", text: "×", onclick: closeDetail }));

    modal._list = list; modal._idx = idx;
  }

  function closeDetail() {
    document.getElementById("detail-backdrop").hidden = true;
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }
  document.getElementById("detail-backdrop").addEventListener("click", function (e) { if (e.target === this) closeDetail(); });

  /* ============================================================
     COLOUR READING
     Real measurement off the pixels, not a guess. Drives the
     Colour axis suggestions so the palette terms are consistent
     across the library instead of eyeballed each time.
     ============================================================ */
  function readColour(dataUrl) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () {
        var N = 64, c = document.createElement("canvas");
        c.width = N; c.height = N;
        var ctx = c.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, N, N);
        var d;
        try { d = ctx.getImageData(0, 0, N, N).data; } catch (e) { resolve([]); return; }

        var ls = [], sats = [], hueBuckets = new Array(12).fill(0), n = 0;
        for (var i = 0; i < d.length; i += 4) {
          var r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
          var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
          var l = (mx + mn) / 2, s = mx === mn ? 0 : (mx - mn) / (1 - Math.abs(2 * l - 1));
          ls.push(l); sats.push(s); n++;
          if (s > 0.42 && l > 0.16 && l < 0.88) {
            var h;
            if (mx === r) h = 60 * (((g - b) / (mx - mn)) % 6);
            else if (mx === g) h = 60 * ((b - r) / (mx - mn) + 2);
            else h = 60 * ((r - g) / (mx - mn) + 4);
            if (h < 0) h += 360;
            hueBuckets[Math.floor(h / 30) % 12]++;
          }
        }
        var avgL = ls.reduce(function (a, x) { return a + x; }, 0) / n;
        var avgS = sats.reduce(function (a, x) { return a + x; }, 0) / n;
        var varL = ls.reduce(function (a, x) { return a + (x - avgL) * (x - avgL); }, 0) / n;
        var sdL = Math.sqrt(varL);
        var satPixels = hueBuckets.reduce(function (a, x) { return a + x; }, 0);
        var topBucket = Math.max.apply(null, hueBuckets);
        var activeBuckets = hueBuckets.filter(function (x) { return x > n * 0.015; }).length;

        // Deliberately conservative. A wrong pre-selection costs more than a
        // missing one: the point is a consistent shared vocabulary, and a term
        // that fires on everything stops discriminating between references.
        var sorted = hueBuckets.slice().sort(function (a, b) { return b - a; });
        var highContrast = sdL > 0.29;
        var out = [];

        if (avgS < 0.12) out.push("monochrome");
        if (avgL < 0.32) out.push("dark ground");
        if (highContrast) out.push("high contrast");
        if (satPixels > n * 0.07 && topBucket > satPixels * 0.68 && activeBuckets <= 2) {
          out.push("single saturated accent");
        } else if (activeBuckets === 2 && satPixels > n * 0.12 &&
                   (sorted[0] + sorted[1]) > satPixels * 0.88) {
          out.push("duotone");
        }
        if (!highContrast && avgS >= 0.12 && avgS < 0.26 && avgL >= 0.32) out.push("muted palette");
        if (avgS < 0.24 && avgL > 0.66) {
          var warm = hueBuckets[0] + hueBuckets[1] + hueBuckets[11];
          var cool = hueBuckets[5] + hueBuckets[6] + hueBuckets[7];
          out.push(warm >= cool ? "warm neutral ground" : "cool neutral ground");
        }
        var seen = {};
        resolve(out.filter(function (v) { return seen[v] ? false : (seen[v] = true); }).slice(0, 3));
      };
      img.onerror = function () { resolve([]); };
      img.src = dataUrl;
    });
  }

  /* ---------- brief composition ---------- */
  function composeBrief(title, type, vocab) {
    if (!vocab.length) return title + ", a " + type.toLowerCase() + " reference.";
    var by = {};
    vocab.forEach(function (v) { var a = AXIS_BY_TERM[v]; if (a) { (by[a] = by[a] || []).push(v); } });
    var parts = [];
    if (by.colour) parts.push("built on " + list(by.colour));
    if (by.typography) parts.push("set with " + list(by.typography));
    if (by.layout) parts.push("laid out as " + list(by.layout));
    if (by.imagery) parts.push("carried by " + list(by.imagery));
    return title + ", a " + type.toLowerCase() + " reference " + parts.join(", ") + ".";
  }
  function list(arr) {
    if (arr.length === 1) return arr[0];
    if (arr.length === 2) return arr[0] + " and " + arr[1];
    return arr.slice(0, -1).join(", ") + ", and " + arr[arr.length - 1];
  }

  /* ---------- add / edit form ---------- */
  var pendingImage = null, autoTags = [], selected = [];

  function buildPickers() {
    var wrap = document.getElementById("vocab-pickers");
    wrap.innerHTML = "";
    AXES.forEach(function (axis) {
      var group = el("div", { style: "margin-bottom:12px" });
      var head = el("div", { class: "label", text: axis.label, style: "margin-bottom:6px" });
      group.appendChild(head);
      var picker = el("div", { class: "picker" });
      axis.terms.forEach(function (t) {
        var b = el("button", {
          type: "button",
          class: "pick" + (selected.indexOf(t) !== -1 ? " is-on" : "") + (autoTags.indexOf(t) !== -1 ? " is-auto" : ""),
          text: t,
          onclick: function () {
            var i = selected.indexOf(t);
            if (i === -1) selected.push(t); else selected.splice(i, 1);
            buildPickers(); refreshBrief();
          }
        });
        picker.appendChild(b);
      });
      group.appendChild(picker);
      if (axis.key === "colour" && autoTags.length) {
        group.appendChild(el("div", { class: "auto-note", text: "Outlined terms were read from the image's pixels and pre-selected." , style: "margin-top:7px"}));
      }
      wrap.appendChild(group);
    });
  }

  var briefTouched = false;
  function refreshBrief() {
    if (briefTouched) return;
    var t = document.getElementById("f-title").value.trim() || "Untitled";
    var ty = document.getElementById("f-type").value;
    document.getElementById("f-brief").value = composeBrief(t, ty, selected);
  }

  function resetForm() {
    document.getElementById("entry-form").reset();
    document.getElementById("drop-preview").classList.remove("has-img");
    document.getElementById("dropzone-text").textContent = "Drop an image here, or click to choose";
    document.getElementById("dropzone").classList.remove("compact");
    pendingImage = null; autoTags = []; selected = []; briefTouched = false;
    state.editingId = null;
    document.getElementById("delete-entry").hidden = true;
    buildPickers();
  }

  function openAdd() {
    resetForm();
    document.getElementById("form-heading").textContent = "Add to the library";
    document.getElementById("submit-form").textContent = "Add card";
    lastFocused = document.activeElement;
    document.getElementById("form-backdrop").hidden = false;
    document.getElementById("f-title").focus();
  }

  function openEdit(id) {
    var card = state.cards.find(function (c) { return c.id === id; });
    if (!card) return;
    resetForm();
    state.editingId = id;
    document.getElementById("form-heading").textContent = "Edit reference";
    document.getElementById("submit-form").textContent = "Save changes";
    document.getElementById("delete-entry").hidden = false;
    document.getElementById("f-title").value = card.title;
    document.getElementById("f-url").value = card.sourceUrl || "";
    document.getElementById("f-type").value = card.type;
    document.getElementById("f-brief").value = card.brief || "";
    briefTouched = true;
    pendingImage = card.image;
    selected = (card.vocab || []).slice();
    document.getElementById("drop-preview-img").src = card.image;
    document.getElementById("drop-preview").classList.add("has-img");
    document.getElementById("dropzone-text").textContent = "Replace image";
    dz.classList.add("compact");
    buildPickers();
    lastFocused = document.activeElement;
    document.getElementById("form-backdrop").hidden = false;
  }

  function closeForm() {
    document.getElementById("form-backdrop").hidden = true;
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }

  function handleFile(file) {
    if (!file || file.type.indexOf("image/") !== 0) { showToast("That file is not an image"); return; }
    var reader = new FileReader();
    reader.onload = function () {
      pendingImage = reader.result;
      document.getElementById("drop-preview-img").src = pendingImage;
      document.getElementById("drop-preview").classList.add("has-img");
      document.getElementById("dropzone-text").textContent = "Replace image";
      dz.classList.add("compact");
      readColour(pendingImage).then(function (tags) {
        autoTags = tags;
        tags.forEach(function (t) { if (selected.indexOf(t) === -1) selected.push(t); });
        buildPickers(); refreshBrief();
        if (tags.length) showToast("Read " + tags.length + " colour " + (tags.length === 1 ? "term" : "terms") + " from the image");
      });
    };
    reader.readAsDataURL(file);
  }

  var dz = document.getElementById("dropzone");
  document.getElementById("f-image").addEventListener("change", function (e) { handleFile(e.target.files[0]); });
  ["dragenter", "dragover"].forEach(function (ev) {
    dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add("is-over"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove("is-over"); });
  });
  dz.addEventListener("drop", function (e) {
    if (e.dataTransfer && e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });

  document.getElementById("f-title").addEventListener("input", refreshBrief);
  document.getElementById("f-brief").addEventListener("input", function () { briefTouched = true; });

  document.getElementById("entry-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var title = document.getElementById("f-title").value.trim();
    var type = document.getElementById("f-type").value;
    if (!pendingImage) { showToast("Choose a screenshot first"); return; }
    if (!title) { showToast("Give it a title"); return; }
    if (!selected.length) { showToast("Pick at least one vocabulary term"); return; }
    var brief = document.getElementById("f-brief").value.trim() || composeBrief(title, type, selected);
    var url = document.getElementById("f-url").value.trim();

    if (state.editingId) {
      var card = state.cards.find(function (c) { return c.id === state.editingId; });
      if (card) {
        card.title = title; card.type = type; card.vocab = selected.slice();
        card.brief = brief; card.sourceUrl = url; card.image = pendingImage;
      }
      closeForm(); render(); showToast("Saved " + title);
    } else {
      state.cards.unshift({
        id: "card-" + Date.now(), added: Date.now(),
        title: title, image: pendingImage, sourceUrl: url,
        type: type, vocab: selected.slice(), brief: brief
      });
      closeForm(); render(); showToast("Added " + title);
    }
  });

  document.getElementById("delete-entry").addEventListener("click", function () {
    if (!state.editingId) return;
    var card = state.cards.find(function (c) { return c.id === state.editingId; });
    if (!card) return;
    if (!window.confirm("Delete " + card.title + "? This cannot be undone.")) return;
    state.cards = state.cards.filter(function (c) { return c.id !== state.editingId; });
    closeForm(); render(); showToast("Deleted " + card.title);
  });

  document.getElementById("open-add").addEventListener("click", openAdd);
  document.getElementById("cancel-form").addEventListener("click", closeForm);
  document.getElementById("form-backdrop").addEventListener("click", function (e) { if (e.target === this) closeForm(); });

  /* ---------- toolbar ---------- */
  document.getElementById("search").addEventListener("input", function (e) { state.query = e.target.value; render(); });
  document.getElementById("sort").addEventListener("change", function (e) { state.sort = e.target.value; render(); });

  document.getElementById("reset-btn").addEventListener("click", function () {
    if (!window.confirm("Replace the current library with the " + SEED.length + " references from the repository?")) return;
    state.cards = SEED.map(function (c) { return JSON.parse(JSON.stringify(c)); });
    state.activeFilters = []; state.query = ""; state.showAllTags = false;
    document.getElementById("search").value = "";
    render(); showToast("Restored the library from the repository");
  });

  document.getElementById("export-btn").addEventListener("click", function () {
    var payload = JSON.stringify({ version: 1, exported: new Date().toISOString(), cards: state.cards }, null, 2);
    var name = "inspiration-library.json";
    if (window.claude && window.claude.downloads) {
      window.claude.downloads.save({ filename: name, data: payload }).then(
        function () { showToast("Exported " + state.cards.length + " references"); },
        function (err) {
          if (err && err.code === "declined") return;
          if (err && err.code === "too_large") { showToast("Too large to export. Remove a few references and try again."); return; }
          fallbackDownload(payload, name);
        }
      );
    } else { fallbackDownload(payload, name); }
  });

  function fallbackDownload(payload, name) {
    try {
      var blob = new Blob([payload], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
      showToast("Exported " + state.cards.length + " references");
    } catch (e) { showToast("Export is unavailable in this view"); }
  }

  document.getElementById("import-btn").addEventListener("click", function () { document.getElementById("import-file").click(); });
  document.getElementById("import-file").addEventListener("change", function (e) {
    var file = e.target.files[0]; if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.cards)) throw new Error("shape");
        state.cards = parsed.cards;
        state.activeFilters = []; state.query = "";
        document.getElementById("search").value = "";
        render(); showToast("Imported " + parsed.cards.length + " references");
      } catch (err) { showToast("That file is not a library export"); }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  /* ---------- clipboard ---------- */
  function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { t.hidden = true; }, 2600);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { showToast("Prompt copied"); },
        function () { showToast("Could not copy. Select the text and copy manually."); }
      );
    } else { showToast("Clipboard is unavailable in this browser"); }
  }

  function copyImage(dataUrl) {
    if (!navigator.clipboard || !window.ClipboardItem) { showToast("Image copy is unsupported in this browser"); return; }
    try {
      var item = new ClipboardItem({
        "image/png": new Promise(function (resolve, reject) {
          var img = new Image();
          img.onload = function () {
            var c = document.createElement("canvas");
            c.width = img.naturalWidth; c.height = img.naturalHeight;
            c.getContext("2d").drawImage(img, 0, 0);
            c.toBlob(function (b) { b ? resolve(b) : reject(new Error("encode")); }, "image/png");
          };
          img.onerror = function () { reject(new Error("load")); };
          img.src = dataUrl;
        })
      });
      navigator.clipboard.write([item]).then(
        function () { showToast("Image copied"); },
        function () { showToast("Could not copy the image"); }
      );
    } catch (e) { showToast("Could not copy the image"); }
  }

  /* ---------- keyboard ---------- */
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (!document.getElementById("detail-backdrop").hidden) closeDetail();
      else if (!document.getElementById("form-backdrop").hidden) closeForm();
      return;
    }
    var db = document.getElementById("detail-backdrop");
    if (!db.hidden && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
      if (document.activeElement && document.activeElement.tagName === "TEXTAREA") return;
      var modal = document.getElementById("detail-modal");
      if (!modal._list) return;
      var next = modal._idx + (e.key === "ArrowRight" ? 1 : -1);
      if (next >= 0 && next < modal._list.length) { e.preventDefault(); paintDetail(modal._list, next); }
    }
  });

  /* ---------- init ---------- */
  var typeSel = document.getElementById("f-type");
  TYPES.forEach(function (t) { typeSel.appendChild(el("option", { value: t, text: t })); });
  typeSel.addEventListener("change", refreshBrief);

  loadState();
  document.getElementById("sort").value = state.sort;
  buildPickers();
  render();
  if (freshBuild) showToast("Updated to the latest library from the repository");
})();
</script>
